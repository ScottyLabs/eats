[project]
name = "eats"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
##############
# dining-api #
##############
MAPKIT_ALLOWED_ORIGINS = { description = "Comma-separated web origins the MapKit JS token is valid for", default = "" }
MAPKIT_JS_AUTH_KEY = { description = "Base64 MapKit JS private key" }
MAPKIT_JS_KEY_ID = { description = "MapKit JS key ID" }
MAPKIT_JS_TEAM_ID = { description = "Apple developer team ID" }
NUMBER_OF_SCRAPES = { description = "TODO", default = "10" }
SLACK_BACKEND_WEBHOOK_URL = { description = "TODO" }
SLACK_FRONTEND_WEBHOOK_URL = { description = "TODO" }
SLACK_MAIN_CHANNEL_WEBHOOK_URL = { description = "TODO" }
INTER_SCRAPE_WAIT_INTERVAL = { description = "TODO", default = "5000" }
RELOAD_WAIT_INTERVAL = { description = "TODO", default = "1800000" }
KEYCLOAK_URL = { description = "Keycloak base URL, from governance's oidc_client feature" }
KEYCLOAK_REALM = { description = "Keycloak realm, from governance's oidc_client feature" }
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID, from governance's oidc_client feature" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret, from governance's oidc_client feature" }
OAUTH_RELAY_URL = { description = "Ricochet callback the Keycloak client redirects to, from governance's oidc_client feature" }
SESSION_COOKIE_SIGNING_SECRET = { description = "TODO", default = "lemon melon cookie" }
DEV_DONT_FETCH = { description = "set this to false to update the database on startup", default = "false" }

[profiles.prod]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "prod" }
NODE_ENV = { description = "Node environment", default = "production" }
PUBLIC_POSTHOG_KEY = { description = "PostHog project API key" }
PUBLIC_POSTHOG_HOST = { description = "PostHog ingestion host" }
ALERT_EMAIL_SEND = { description = "Comma-separated recipients of location reports" }
EMAIL_FROM = { description = "Sender address from governance's email feature" }
EMAIL_INBOX = { description = "Group copied on sent mail, from governance's email feature" }
SMTP_HOST = { description = "SMTP host from governance's email feature" }
SMTP_PORT = { description = "SMTP port (implicit TLS) from governance's email feature" }
SMTP_USERNAME = { description = "SMTP username from governance's email feature" }
SMTP_PASSWORD = { description = "SMTP password from governance's email feature" }

[profiles.staging]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "staging" }
NODE_ENV = { description = "Node environment", default = "production" }

[profiles.preview]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "dev" }
NODE_ENV = { description = "Node environment", default = "production" }

[profiles.dev]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "dev" }
NODE_ENV = { description = "Node environment", default = "development" }
MAPKIT_ALLOWED_ORIGINS = { description = "Comma-separated web origins the MapKit JS token is valid for", default = "http://localhost:5173" }

[scopes.public]
secrets = ["PUBLIC_POSTHOG_KEY", "PUBLIC_POSTHOG_HOST"]
