[profiles.prod]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "prod" }
NODE_ENV = { description = "Node environment", default = "production" }

[profiles.staging]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "staging" }
NODE_ENV = { description = "Node environment", default = "production" }

[profiles.preview]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "dev" }
NODE_ENV = { description = "Node environment", default = "production" }

[profiles.dev]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "dev" }
