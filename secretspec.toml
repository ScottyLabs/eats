[project]
name = "eats"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

[profiles.default]
#######
# web #
#######
MAPKIT_ALLOWED_ORIGINS = { description = "TODO", default = "" }
MAPKIT_JS_AUTH_KEY = { description = "TODO" }
MAPKIT_JS_KEY_ID = { description = "TODO" }
MAPKIT_JS_TEAM_ID = { description = "TODO" }
VITE_API_URL = { description = "backend url, possible values: local, http://localhost:5010, https://api.staging.cmueats.com" }

##############
# dining-api #
##############
NUMBER_OF_SCRAPES = { description = "TODO", default = "10" }
SLACK_BACKEND_WEBHOOK_URL = { description = "TODO" }
SLACK_FRONTEND_WEBHOOK_URL = { description = "TODO" }
SLACK_MAIN_CHANNEL_WEBHOOK_URL = { description = "TODO" }
INTER_SCRAPE_WAIT_INTERVAL = { description = "TODO", default = "5000" }
RELOAD_WAIT_INTERVAL = { description = "TODO", default = "1800000" }
OIDC_SERVER = { description = "TODO" }
OIDC_CLIENT_ID = { description = "TODO" }
OIDC_CLIENT_SECRET = { description = "TODO" }
SESSION_COOKIE_SIGNING_SECRET = { description = "TODO", default = "lemon melon cookie" }
GOOGLE_CLIENT_ID = { description = "TODO" }
GOOGLE_CLIENT_SECRET = { description = "TODO" }
GOOGLE_REFRESH_TOKEN = { description = "TODO" }
ALERT_EMAIL_SEND = { description = "TODO" }
ALERT_EMAIL_CC = { description = "TODO" }
DEV_DONT_FETCH = { description = "set this to false to update the database on startup", default = "false" }

[profiles.prod]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "prod" }
NODE_ENV = { description = "Node environment", default = "production" }
POSTHOG_KEY = { description = "PostHog project API key" }
POSTHOG_HOST = { description = "PostHog ingestion host" }

[profiles.staging]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "staging" }
NODE_ENV = { description = "Node environment", default = "production" }

[profiles.preview]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "dev" }
NODE_ENV = { description = "Node environment", default = "production" }

[profiles.dev]
ENV = { description = "Runtime environment (dev|staging|prod)", default = "dev" }
NODE_ENV = { description = "Node environment", default = "development" }

[scopes.build]
secrets = [
  "MAPKIT_ALLOWED_ORIGINS",
  "MAPKIT_JS_AUTH_KEY",
  "MAPKIT_JS_KEY_ID",
  "MAPKIT_JS_TEAM_ID",
  "VITE_API_URL",
  "POSTHOG_KEY",
  "POSTHOG_HOST",
]
