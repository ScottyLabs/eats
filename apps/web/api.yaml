tags: []
info:
  title: CMU Dining API
  description: Hello!~ Thanks for checking out the cmueats api. Have a great day!
  version: 2.0.0
openapi: 3.1.2
paths:
  /whoami:
    get:
      description: If you have an active login session with cmueats, this will return
        your user info. (this is NOT intended to work cross-site)
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    nullable: true
                    type:
                      - object
                      - "null"
                    required:
                      - googleId
                      - id
                      - email
                      - firstName
                      - lastName
                      - pictureUrl
                    properties:
                      googleId:
                        type: string
                      id:
                        type: number
                      email:
                        type: string
                      firstName:
                        nullable: true
                        type:
                          - string
                          - "null"
                      lastName:
                        nullable: true
                        type:
                          - string
                          - "null"
                      pictureUrl:
                        nullable: true
                        type:
                          - string
                          - "null"
      operationId: getWhoami
  /:
    get:
      responses:
        "200":
          description: Response for status 200
          content:
            text/plain:
              schema:
                examples:
                  - ScottyLabs Dining API
                type: string
      operationId: getIndex
  /v2/locations:
    get:
      description: The times array is guaranteed to be sorted and non-overlapping.
        Both start and end are inclusive boundaries
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - times
                    - todaysSoups
                    - todaysSpecials
                    - name
                    - location
                    - ratingsAvg
                    - ratingsCount
                    - shortDescription
                    - description
                    - url
                    - menu
                    - coordinateLat
                    - coordinateLng
                    - acceptsOnlineOrders
                    - id
                    - conceptId
                  properties:
                    times:
                      type: array
                      items:
                        type: object
                        required:
                          - start
                          - end
                        properties:
                          start:
                            examples:
                              - 1792281430566
                            type: number
                          end:
                            examples:
                              - 1792281430571
                            type: number
                    todaysSoups:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - description
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                    todaysSpecials:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - description
                        properties:
                          name:
                            type: string
                          description:
                            type: string
                    name:
                      nullable: true
                      examples:
                        - Schatz
                      type:
                        - string
                        - "null"
                    location:
                      type: string
                    ratingsAvg:
                      nullable: true
                      type:
                        - number
                        - "null"
                    ratingsCount:
                      type: number
                    shortDescription:
                      nullable: true
                      type:
                        - string
                        - "null"
                    description:
                      type: string
                    url:
                      type: string
                    menu:
                      nullable: true
                      type:
                        - string
                        - "null"
                    coordinateLat:
                      nullable: true
                      type:
                        - number
                        - "null"
                    coordinateLng:
                      nullable: true
                      type:
                        - number
                        - "null"
                    acceptsOnlineOrders:
                      type: boolean
                    id:
                      type: string
                    conceptId:
                      nullable: true
                      type:
                        - string
                        - "null"
      operationId: getV2Locations
  /emails:
    get:
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - name
                    - email
                  properties:
                    name:
                      example: Alice
                      type: string
                    email:
                      example: alice72@andrew.cmu.edu
                      type: string
      operationId: getEmails
  /api/health:
    get:
      description: ScottyLabs kennel deployment requires backend services to expose a
        GET /api/health endpoint that returns HTTP 200 once it is ready to
        accept traffic
      responses:
        "200":
          description: Response for status 200
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: Response for status 503
          content:
            text/plain:
              schema:
                type: string
      operationId: getApiHealth
  /report:
    post:
      description: Endpoint for reporting errors in information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - locationId
                - message
              properties:
                locationId:
                  type: string
                message:
                  minLength: 1
                  maxLength: 512
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - locationId
                - message
              properties:
                locationId:
                  type: string
                message:
                  minLength: 1
                  maxLength: 512
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
                - locationId
                - message
              properties:
                locationId:
                  type: string
                message:
                  minLength: 1
                  maxLength: 512
                  type: string
      operationId: postReport
  /v2/locations/{locationId}/reviews/summary:
    get:
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - starData
                  - tagData
                properties:
                  starData:
                    type: object
                    required:
                      - avg
                      - personalRating
                      - buckets
                    properties:
                      avg:
                        nullable: true
                        type:
                          - number
                          - "null"
                      personalRating:
                        nullable: true
                        type:
                          - number
                          - "null"
                      buckets:
                        example:
                          - 0
                          - 1
                          - 0
                          - 4
                          - 12
                          - 4
                        description: Count of ratings of star rating
                          [{.5},{1,1.5},{2,2.5},{3,3.5},{4,4.5},{5}]
                        type: array
                        items:
                          type: number
                  tagData:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - totalVotes
                        - totalLikes
                        - myReview
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                        totalVotes:
                          type: number
                        totalLikes:
                          type: number
                        myReview:
                          nullable: true
                          type:
                            - object
                            - "null"
                          required:
                            - vote
                            - text
                            - createdAt
                            - updatedAt
                          properties:
                            vote:
                              type: boolean
                            text:
                              nullable: true
                              type:
                                - string
                                - "null"
                            createdAt:
                              type: number
                            updatedAt:
                              type: number
      operationId: getV2LocationsByLocationIdReviewsSummary
  /v2/locations/{locationId}/reviews/stars/me:
    put:
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stars
              properties:
                stars:
                  minimum: 0.5
                  maximum: 5
                  multipleOf: 0.5
                  type: number
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - stars
              properties:
                stars:
                  minimum: 0.5
                  maximum: 5
                  multipleOf: 0.5
                  type: number
          multipart/form-data:
            schema:
              type: object
              required:
                - stars
              properties:
                stars:
                  minimum: 0.5
                  maximum: 5
                  multipleOf: 0.5
                  type: number
      operationId: putV2LocationsByLocationIdReviewsStarsMe
    delete:
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      operationId: deleteV2LocationsByLocationIdReviewsStarsMe
  /v2/locations/{locationId}/reviews/tags/{tagId}/me:
    put:
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
        - name: tagId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - voteUp
                - text
              properties:
                voteUp:
                  nullable: true
                  type:
                    - boolean
                    - "null"
                text:
                  nullable: true
                  maxLength: 1000
                  type:
                    - string
                    - "null"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - voteUp
                - text
              properties:
                voteUp:
                  nullable: true
                  type:
                    - boolean
                    - "null"
                text:
                  nullable: true
                  maxLength: 1000
                  type:
                    - string
                    - "null"
          multipart/form-data:
            schema:
              type: object
              required:
                - voteUp
                - text
              properties:
                voteUp:
                  nullable: true
                  type:
                    - boolean
                    - "null"
                text:
                  nullable: true
                  maxLength: 1000
                  type:
                    - string
                    - "null"
      operationId: putV2LocationsByLocationIdReviewsTagsByTagIdMe
  /v2/locations/{locationId}/reviews/tags:
    get:
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - writtenReview
                    - tagName
                    - id
                    - tagId
                    - userId
                    - locationId
                    - vote
                    - createdAt
                    - updatedAt
                  properties:
                    writtenReview:
                      type: string
                    tagName:
                      type: string
                    id:
                      type: number
                    tagId:
                      type: number
                    userId:
                      type: number
                    locationId:
                      type: string
                    vote:
                      type: boolean
                    createdAt:
                      type: number
                    updatedAt:
                      type: number
      operationId: getV2LocationsByLocationIdReviewsTags
  /v2/locations/{locationId}/reports:
    get:
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response for status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - userId
                    - createdAt
                    - locationId
                    - message
                  properties:
                    id:
                      type: number
                    userId:
                      nullable: true
                      type:
                        - number
                        - "null"
                    createdAt:
                      anyOf:
                        - type: string
                          format: date-time
                        - format: date
                          type: string
                        - type: number
                    locationId:
                      type: string
                    message:
                      type: string
      operationId: getV2LocationsByLocationIdReports
components:
  schemas: {}
